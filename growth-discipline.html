        [['improve','今天需要改进的','textarea','只写最值得调整的一到两件事']],
        [['tomorrow','明日最重要的事','text','明天优先完成什么？']],
        [['selfReward','今日奖励','text','例如：看一集喜欢的节目'],['selfPenalty','今日约束','text','例如：明天少玩手机 30 分钟']]
      ]
    };
    let records=load();let active='dashboard';let selectedDate=localDate();
    const $=s=>document.querySelector(s);const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
    function localDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function offset(days){const d=new Date();d.setDate(d.getDate()+days);return localDate(d)}
    function load(){try{const saved=localStorage.getItem(STORE);if(saved){const v=JSON.parse(saved);return Array.isArray(v)?v:[]}const old=JSON.parse(localStorage.getItem(OLD_STORE)||'[]');if(!Array.isArray(old))return[];const migrated=old.map(r=>r.category==='health'?{...r,category:'evening',data:{nightWeight:r.data?.weight||'',dinner:r.data?.meals||''}}:r).filter(r=>sections.some(s=>s.key===r.category));localStorage.setItem(STORE,JSON.stringify(migrated));return migrated}catch{return []}}
    function persist(){localStorage.setItem(STORE,JSON.stringify(records))}
    function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function showToast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
    function initNav(){const side=$('#sideNav'),mobile=$('#mobileNav');side.innerHTML=sections.map(s=>`<button class="nav-item" data-view="${s.key}">${icon(s.icon)}${s.label}</button>`).join('');mobile.innerHTML=sections.map(s=>`<button class="mobile-link" data-view="${s.key}">${icon(s.icon)}<span>${s.short}</span></button>`).join('');document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){active=b.dataset.view;selectedDate=localDate();render()}})}
    function render(){const s=sections.find(x=>x.key===active);document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===active));$('#todayText').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());$('#pageTitle').textContent=active==='dashboard'?'今天，按自己的节奏推进':s.label;$('#content').innerHTML=active==='dashboard'?overview():recordForm(s);bind();location.hash=active==='dashboard'?'':active}
    function overview(){const today=records.filter(r=>r.date===localDate()),completed=new Set(today.map(r=>r.category)),total=sections.length-1,completion=Math.round(completed.size/total*100),score=scoreDay(localDate()),streak=calcStreak(),spending=spendTotal(today.find(r=>r.category==='spending')?.data||{}),week=Array.from({length:7},(_,i)=>scoreDay(offset(i-6)).score);return `<section class="grid metrics"><div class="card hero-card"><div class="hero-top"><div><p class="kicker">今日奖惩积分</p><p class="big-number">${score.score>=0?'+':''}${score.score} 分</p></div><span class="hero-icon">${icon('target')}</span></div><div class="progress"><span style="width:${Math.max(0,Math.min(100,score.score))}%"></span></div><p class="hero-note">${rewardLabel(score.score)} · 默认目标：07:00 起床，23:30 前入睡</p></div>${metric('今日进度',completed.size+' / '+total,completion+'% 已记录 · 连续 '+streak+' 天','check')}${metric('今日消费','¥'+spending.toFixed(2),spending>GOALS.budget?'已超过 ¥'+GOALS.budget+' 目标':'日目标 ¥'+GOALS.budget+' 以内','spending')}</section><section class="grid dashboard-main"><div class="card panel"><div class="section-heading"><div><h2>今日生活轨迹</h2><p>按一天的顺序记录，随时回来补充</p></div><span class="counter">${completed.size} / ${total}</span></div><div class="checklist">${sections.slice(1).map(s=>`<button class="check-row" data-view="${s.key}"><span class="check-icon ${s.tone}">${icon(s.icon)}</span><span class="check-copy"><strong>${s.label}</strong><span>${rowDesc(s.key)}</span></span>${completed.has(s.key)?`<span class="done">${icon('check')}</span>`:`<span class="chevron">${icon('chevron')}</span>`}</button>`).join('')}</div></div><div class="card panel"><div class="section-heading"><div><h2>今日奖惩明细</h2><p>只对已经记录的行为计算</p></div><span class="counter">${score.items.length} 项</span></div>${rewardList(score.items)}<div class="section-heading" style="margin-top:22px"><div><h2>近七日积分</h2><p>负分按 0 展示</p></div></div><div class="week-chart">${week.map((v,i)=>`<div class="bar-wrap"><div class="bar ${i===6?'today':''}" title="${v} 分" style="height:${Math.max(4,Math.min(100,Math.max(0,v)))}%"></div><span class="bar-label">${['一','二','三','四','五','六','日'][i]}</span></div>`).join('')}</div><div class="tip"><strong>${rewardLabel(score.score)}</strong><p>稳定积累比偶尔完美更重要；扣分用于发现调整点，不用于责备自己。</p></div></div></section>`}
    function metric(title,value,note,i){return `<div class="card metric-card"><div class="metric-top"><p class="metric-label">${title}</p>${icon(i)}</div><p class="metric-value">${value}</p><p class="metric-note">${note}</p></div>`}
    function calcStreak(){let n=0;for(let i=0;i<365;i++){if(records.some(r=>r.date===offset(-i)))n++;else if(i>0)break}return n}
    function rowDesc(k){return {morning:'起床、体重、早读、新闻',work:'上班打卡、任务安排、待办',noon:'午餐、午休、冥想',offwork:'下班打卡、工作总结',learning:'应用、FDE 与学习产出',exercise:'跑步、力量训练与感受',spending:'饮食、交通、充值、Token',evening:'晚餐、手机时间、入睡',review:'成果、改进、明日重点'}[k]}
    function recordForm(s){const current=records.find(r=>r.category===s.key&&r.date===selectedDate),data=current?.data||{},history=records.filter(r=>r.category===s.key).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7),points=scoreDay(selectedDate).items.filter(i=>i.category===s.key);return `<div class="grid record-layout"><section class="card form-card"><div class="form-head"><div class="form-title-wrap"><span class="form-title-icon ${s.tone}">${icon(s.icon)}</span><div><h2>${s.label}</h2><p>${s.desc}</p></div></div><input class="input date-input" id="recordDate" type="date" value="${selectedDate}" aria-label="记录日期"></div><form id="recordForm"><div class="fields">${fieldHtml(formFields[s.key],data)}</div><div class="form-footer"><p class="form-hint">同一天再次保存会更新记录，并重新计算奖惩积分。</p><button class="primary" type="submit">${icon('save')}保存记录</button></div></form></section><aside class="side-stack"><div class="card history-card"><div class="history-top"><h3>最近记录</h3>${icon('calendar')}</div>${history.length?`<div class="history-list">${history.map(r=>`<button class="history-item ${r.date===selectedDate?'active':''}" data-date="${r.date}"><strong>${r.date}<span class="done" style="width:22px;height:22px">${icon('check')}</span></strong><p>${esc(summary(r))}</p></button>`).join('')}</div>`:`<div class="empty">保存第一条记录后，这里会形成时间线。</div>`}</div><div class="card history-card"><div class="history-top"><h3>本项积分</h3>${icon('target')}</div>${points.length?rewardList(points):'<div class="empty">保存后显示本项加扣分。</div>'}</div></aside></div>`}
    function fieldHtml(rows,data){return rows.map(row=>`<div class="${row.length>1?'two-col':''}">${row.map(f=>fieldControl(f,data)).join('')}</div>`).join('')}
    function fieldControl(f,data){const [key,label,type,ph,options]=f;if(type==='checkbox')return `<label class="check-field"><input type="checkbox" name="${key}" ${data[key]?'checked':''}><span>${label}</span></label>`;if(type==='textarea')return `<label class="field"><span>${label}</span><textarea class="textarea" name="${key}" placeholder="${ph}">${esc(data[key]||'')}</textarea></label>`;if(type==='select')return `<label class="field"><span>${label}</span><select class="select" name="${key}"><option value="">请选择</option>${options.map(o=>`<option ${data[key]===o?'selected':''}>${o}</option>`).join('')}</select></label>`;return `<label class="field"><span>${label}</span><input class="input" name="${key}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(data[key]||'')}" placeholder="${ph}"></label>`}
    function summary(r){const p=r.data||{};if(r.category==='morning')return `${p.wakeTime||'未记起床'} · ${p.readingDone?'已早读':'早读待完成'}`;if(r.category==='work')return p.focus||p.plan||'已完成上班记录';if(r.category==='noon')return `${p.lunch||'已记录午餐'} · 午休 ${p.napMinutes||0} 分钟`;if(r.category==='offwork')return p.summary||'已完成下班记录';if(r.category==='learning')return `${p.topic||'学习'} · ${p.minutes||0} 分钟`;if(r.category==='exercise')return `${p.activity||'运动'} · ${p.minutes||0} 分钟`;if(r.category==='spending')return `合计 ¥${spendTotal(p).toFixed(2)}`;if(r.category==='evening')return `${p.sleepTime?'计划 '+p.sleepTime+' 入睡':'已记录晚间生活'} · 手机 ${p.phoneMinutes||0} 分钟`;return p.wins||p.tomorrow||'已完成每日复盘'}
    function spendTotal(p){return ['food','transport','recharge','token','other'].reduce((n,k)=>n+(Number(p[k])||0),0)}
    function timeValue(v,night=false){if(!v)return null;const [h,m]=v.split(':').map(Number);let n=h*60+m;if(night&&n<720)n+=1440;return n}
    function scoreDay(date){const map=Object.fromEntries(records.filter(r=>r.date===date).map(r=>[r.category,r.data||{}])),items=[];const add=(category,label,points)=>items.push({category,label,points});const m=map.morning;if(m){if(m.wakeTime)add('morning',timeValue(m.wakeTime)<=timeValue(GOALS.wake)?'按目标早起':'起床晚于目标',timeValue(m.wakeTime)<=timeValue(GOALS.wake)?10:-5);if(m.weight)add('morning','完成晨起体重测量',2);if(m.readingDone)add('morning','完成早读',8);if(m.newsDone)add('morning','查看每日新闻',3)}const w=map.work;if(w){if(w.clockIn)add('work','完成上班打卡',5);if(w.plan||w.focus)add('work','制定今日工作计划',5)}const n=map.noon;if(n){if(n.healthyLunch)add('noon','午餐符合计划',3);if(Number(n.napMinutes)>0&&Number(n.napMinutes)<=40)add('noon','完成适量午休',3);if(Number(n.meditationMinutes)>=5)add('noon','完成冥想',5)}const o=map.offwork;if(o){if(o.clockOut)add('offwork','完成下班打卡',5);if(o.summary)add('offwork','完成工作总结',8)}const l=map.learning;if(l&&Number(l.minutes)>0)add('learning',Number(l.minutes)>=30?'学习达到 30 分钟':'完成学习记录',Number(l.minutes)>=30?10:5);const e=map.exercise;if(e&&Number(e.minutes)>0)add('exercise',Number(e.minutes)>=30?'运动达到 30 分钟':'完成运动记录',Number(e.minutes)>=30?10:5);const s=map.spending;if(s){const total=spendTotal(s);add('spending',total<=GOALS.budget?'消费控制在日目标内':'消费超过日目标',total<=GOALS.budget?5:-5)}const v=map.evening;if(v){if(v.sleepTime)add('evening',timeValue(v.sleepTime,true)<=timeValue(GOALS.sleep,true)?'按目标时间入睡':'入睡晚于目标',timeValue(v.sleepTime,true)<=timeValue(GOALS.sleep,true)?10:-10);if(v.phoneMinutes!==undefined&&v.phoneMinutes!==null&&v.phoneMinutes!==''){const phone=Number(v.phoneMinutes);add('evening',phone<=GOALS.phone?'手机时长控制达标':'手机使用时间超标',phone<=GOALS.phone?5:-5)}}const r=map.review;if(r&&(r.wins||r.improve))add('review','完成每日复盘',5);return{score:items.reduce((n,i)=>n+i.points,0),items}}
    function rewardLabel(score){if(score>=70)return'卓越日：奖励自己一枚星';if(score>=50)return'完成日：保持这个节奏';if(score>=25)return'推进日：今天已有积累';return score<0?'调整日：明天减少一个阻力':'起步日：完成下一项即可加分'}
    function rewardList(items){if(!items.length)return'<div class="empty">完成打卡后，这里会显示加扣分原因。</div>';return `<div class="reward-list">${items.map(i=>`<div class="reward-item ${i.points>=0?'good':'bad'}"><span class="reward-dot"></span><span>${esc(i.label)}</span><b>${i.points>=0?'+':''}${i.points}</b></div>`).join('')}</div>`}
    function bind(){const date=$('#recordDate');if(date)date.addEventListener('change',e=>{selectedDate=e.target.value;render()});document.querySelectorAll('[data-date]').forEach(b=>b.addEventListener('click',()=>{selectedDate=b.dataset.date;render()}));const form=$('#recordForm');if(form)form.addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form).entries());form.querySelectorAll('input[type="checkbox"]').forEach(box=>data[box.name]=box.checked);const idx=records.findIndex(r=>r.category===active&&r.date===selectedDate),item={id:idx>=0?records[idx].id:Date.now(),category:active,date:selectedDate,data,updatedAt:new Date().toISOString()};if(idx>=0)records[idx]=item;else records.push(item);persist();render();showToast('已保存，并更新今日积分')})}
    initNav();const fromHash=location.hash.slice(1);if(sections.some(s=>s.key===fromHash))active=fromHash;render();
  })();
  </script>
</body>
</html>
